# Servidor intermedio (relay) para conectar el juego con el MCP desde cualquier dispositivo.
# En Render: New -> Blueprint -> elige este repositorio.
services:
  - type: web
    name: mission-trainer-relay
    runtime: python
    plan: free
    rootDir: relay
    buildCommand: pip install -r requirements.txt
    startCommand: python servidor_relay.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Clave para /difusion (la genera Render; cópiala al .env del listener)
      - key: DIFUSION_CLAVE
        generateValue: true
      # Para guardar resultados en Supabase (ranking de la página)
      - key: SUPABASE_URL
        value: https://nsaeswvffgfxueftnqda.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false   # secreta: se pega a mano en el panel de Render
